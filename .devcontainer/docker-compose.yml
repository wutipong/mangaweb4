services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename:-mangaweb4}:cached
      # Persist the Go module/build cache between rebuilds.
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/vscode/.cache/go-build
    command: sleep infinity
    environment:
      MANGAWEB_DB: postgres://postgres:password@db:5432/manga?sslmode=disable
      MANGAWEB_DB_TYPE: postgres
      MANGAWEB_ADDRESS: ":8972"
      MANGAWEB_DEBUG: "true"

      OIDC_ENABLE: true
      OIDC_CLIENT: mangaweb4
      OIDC_SECRET: mangaweb4-secret
      OIDC_AUTHORIZE: http://localhost:5556/auth
      OIDC_TOKEN: http://oidc:5556/token
      OIDC_ISSUER: http://localhost:5556
      OIDC_JWKS: http://oidc:5556/keys
      OIDC_LOGOUT: http://localhost:5173/logout
      OIDC_CONFIG: http://localhost:5556/.well-known/openid-configuration

      LOG_LEVEL: debug

      BETTER_AUTH_SECRET: P1SF89ypV6TNDL60oR4tf2y8qCHaNPH3gcrDKQvThk=
      BETTER_AUTH_URL: http://localhost:5173

    depends_on:
      db:
        condition: service_healthy
    networks:
      - mangaweb

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: manga
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d manga" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mangaweb
  oidc:
    image: ghcr.io/dexidp/dex:v2.41.0
    command: dex serve /etc/dex/cfg/config.yaml
    volumes:
      - ./dex-config.yaml:/etc/dex/cfg/config.yaml:ro
    ports:
      - "5556:5556" # Maps the browser-facing localhost:5556 port
    networks:
      - mangaweb
      
volumes:
  postgres-data:
  go-mod-cache:
  go-build-cache:

networks:
  mangaweb:
    driver: bridge
