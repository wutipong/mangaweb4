# config.yaml
# Force the issuer URL to remain uniform across all networks
issuer: http://localhost:5556

storage:
  type: memory

web:
  # Listen internally inside the container on port 5556
  http: 0.0.0.0:5556

# Enables a simple, local username/password login screen
enablePasswordDB: true

staticPasswords:
  - email: "admin@example.com"
    password: "password"
    username: "admin"
    userID: "08a515a8-1200-400d-a34e-37966f3630f5"
    hash: "$2a$12$7wNikYGmkFdMMCCfhKSZ1.gPKeOY1fnqY2XVZSH4ZT8nGPigwsmJS"

# Configure your client credentials here
staticClients:
  - id: mangaweb4
    secret: mangaweb4-secret
    name: "MangaWeb 4"
    redirectURIs:
      - 'http://localhost:5173/login/callback' # Swap with your app's actual callback path
      - 'http://localhost:4173/login/callback'
      - 'http://localhost:3000/login/callback'
